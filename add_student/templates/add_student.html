{%load static%} 

<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

<h1>Add Student</h1>

<form method="POST">
  {% csrf_token %}
<div class="tables">

  <tables><input type="text" name="name" placeholder="Enter Name"></tables>

  <input type="text" name="phone" placeholder="Phone Number"> 

  <button type="submit" >SAVE DATA </button>

</form>
